else if(page==='room')h=title('Мастерская Тиши','Твоё маленькое уютное пространство.')+`<div class="room sp"><img src="${art.room}" alt="Уютная 3D-мастерская"><div class="coin">✦ ${s.points} затей</div>${pic('rest','pet')}${goods.filter(g=>s.placed.includes(g.id)).map(g=>`<span class="decor" style="left:${g.x}%;top:${g.y}%">${g.e}</span>`).join('')}</div><div class="grid sp">${tile('shop','Лавка затей','Обустроить комнату')}${tile('success','Мои успехи','Маленькие победы')}</div><div class="card pink row">${pic('rest')}<div><h3>Тиша сегодня отдыхает</h3><p class="muted">Он рад видеть тебя в любой день. Даже если дела остались на завтра.</p></div></div><p class="smallnote">Предметы пока отображаются условными иконками поверх 3D-интерьера.</p>`;
else if(page==='shop')h=title('Лавка затей','Предметы для твоей мастерской.','room')+`<div class="card pink"><div class="label">Твоя копилка</div><div class="big">✦ ${s.points}</div></div>${goods.map(g=>`<div class="card row"><span style="font-size:32px">${g.e}</span><div class="grow"><strong>${g.n}</strong><div class="muted">${s.owned.includes(g.id)?'В коллекции':g.price+' затей'}</div></div>${s.owned.includes(g.id)?btn(s.placed.includes(g.id)?'Убрать':'Поставить','place:'+g.id,'outline'):`<button class="primary" data-a="buy:${g.id}" ${s.points<g.price?'disabled':''}>Купить</button>`}</div>`).join('')}${btn('В мастерскую','go:room','outline wide')}`;
else if(page==='success')h=title('А ты вообще-то молодец.','Здесь замечаем то, что получилось.','room')+`<div class="hero sp"><div class="copy"><h1>Маленькие<br>и большие<br>победы!</h1></div>${pic('tisha','')}</div><div class="grid sp">${[[completed.length,'Выполнено дел'],[completed.reduce((n,t)=>n+t.min,0),'Минут по плану'],[s.thoughts.length,'Мыслей сохранено'],[s.points+' ✦','Затей в копилке']].map(([n,l])=>`<div class="metric"><b>${n}</b>${l}</div>`).join('')}</div><h2>Что получилось</h2><div class="card">${completed.map(t=>`<p style="margin:7px 0">✓ ${esc(t.t)}</p>`).join('')||'Сегодня ещё всё впереди.'}</div>${btn('+ А я ещё и это сделала','completedtask','primary wide')}`;
main.innerHTML=h+(!storageOK?'<p class="notice">Постоянное сохранение в этом браузере недоступно или хранилище переполнено. Данные могут исчезнуть после закрытия.</p>':'')}
function sheet(h){modal.innerHTML=`<div class="overlay"><div class="sheet">${h}</div></div>`}function close(){modal.innerHTML=''}function formTask(t,complete=false){sheet(`<div class="row between"><h2 style="margin:0">${t?'Редактировать':complete?'Ещё одна победа':'Новое дело'}</h2>${btn('×','close','outline')}</div><form id="taskform"><input type="hidden" name="id" value="${t?.id||''}"><input type="hidden" name="complete" value="${complete?'1':'0'}"><label>Что нужно сделать?</label><input name="t" required value="${esc(t?.t||'')}" placeholder="Например, отправить письмо"><label>Сфера жизни</label><select name="c">${s.categories.map(c=>`<option ${c===(t?.c||filter)?'selected':''}>${esc(c)}</option>`).join('')}</select><div class="grid"><div><label>Дата (необязательно)</label><input type="date" name="date" value="${esc(t?t.date||'':day())}"></div><div><label>Минут на дело</label><input type="number" min="1" max="1440" name="min" value="${t?.min||15}"></div></div><label class="row"><input type="checkbox" name="priority" style="width:20px" ${t?.priority!==false?'checked':''}> Приоритетная задача</label><label>Напоминание (пока настройка)</label><select name="remind">${['Без напоминания','Нежный намёк','Каждые 30 минут','Жёсткий срок'].map(n=>`<option ${n===t?.remind?'selected':''}>${n}</option>`).join('')}</select><button class="primary wide sp">Сохранить</button></form>${t?`<div class="row sp">${btn('На завтра','postpone:'+t.id,'outline')}${btn('Удалить','deltask:'+t.id,'outline')}</div>`:''}`)}function simpleForm(id,title,placeholder){sheet(`<div class="row between"><h2 style="margin:0">${title}</h2>${btn('×','close','outline')}</div><form id="${id}" class="sp"><input required name="t" placeholder="${placeholder}"><button class="primary wide sp">Добавить</button></form>`)}function settings(){sheet(`<h2>Всё под тебя</h2><div class="card row between"><div><strong>Рабочий режим</strong><p class="muted">Только рабочие дела на главной</p></div>${btn(s.work?'Вкл.':'Выкл.','work',s.work?'primary':'outline')}</div><div class="card"><strong>Данные на устройстве</strong><p class="muted">Записи остаются в хранилище этого браузера. Без аккаунта и сервера; при очистке данных могут пропасть.</p><div class="row sp">${btn('Экспорт JSON','export','outline')}${btn('Сбросить демо','reset','outline')}</div></div><p class="smallnote">На iPhone открой HTTPS-ссылку в Safari → Поделиться → На экран «Домой».</p>${btn('Закрыть','close','primary wide')}`)}function notifs(){sheet(`<h2>Тиша напоминает</h2><div class="card pink row">${pic('helper')}<div><h3>Так. Ничего нового не начинаем.</h3><p class="muted">Скоро выходить. Шкаф разберём в другой раз.</p></div></div><div class="row">${btn('Начинаю сборы','ack','primary')}${btn('Через 10 минут','snooze','outline')}</div><div class="card"><strong>Регулярные напоминания</strong><p class="muted">09:00 · Собираем день<br>12:00 · Как дела с ресурсом?<br>15:00 · Выгрузка мыслей<br>19:00 · Завершаем работу<br>21:00 · Итоги<br>23:30 · Мозг, отбой!</p></div><p class="smallnote">Демонстрация. Системные push-уведомления ещё не работают.</p>${btn('Закрыть','close','primary wide')}`)}
async function voice(){if(recorder?.state==='recording'){recorder.stop();return}if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){toast('Запись недоступна в этом браузере.');return}try{voiceStream=await navigator.mediaDevices.getUserMedia({audio:true});recorder=new MediaRecorder(voiceStream);voiceChunks=[];recorder.ondataavailable=e=>{if(e.data.size)voiceChunks.push(e.data)};recorder.onstop=()=>{voiceStream.getTracks().forEach(t=>t.stop());let blob=new Blob(voiceChunks,{type:recorder.mimeType||'audio/mp4'});if(blob.size>1200000){toast('Запись слишком длинная для демо. Попробуй короче.');render();return}let f=new FileReader();f.onload=()=>{s.voice.unshift({id:id(),date:new Date().toLocaleString('ru-RU'),url:f.result});save();render();toast('Голосовая заметка сохранена.')};f.readAsDataURL(blob)};recorder.start();render();toast('Записываем. Нажми «Стоп», когда закончишь.')}catch(e){voiceStream?.getTracks().forEach(t=>t.stop());toast('Не получилось получить доступ к микрофону.')}}
document.addEventListener('click',e=>{let b=e.target.closest('[data-a]');if(!b||b.disabled)return;let [a,v]=b.dataset.a.split(':');let t=s.tasks.find(x=>x.id===v),x=s.thoughts.find(x=>x.id===v),g=goods.find(x=>x.id===v);if(a==='go'){go(v);return}if(a==='close'){close();return}if(a==='settings'){settings();return}if(a==='notifs'){notifs();return}if(a==='resource')s.resource=+v;else if(a==='toggle'&&t){t.done=!t.done;if(t.done&&!t.rewarded){s.points+=2;t.rewarded=true;toast('Готово! +2 затеи.')}}else if(a==='newtask'){formTask();return}else if(a==='completedtask'){formTask(null,true);return}else if(a==='edit'&&t){formTask(t);return}else if(a==='postpone'&&t){let d=new Date();d.setDate(d.getDate()+1);t.date=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;t.done=false;close();toast('Перенесли на завтра.')}else if(a==='deltask'){s.tasks=s.tasks.filter(x=>x.id!==v);close()}else if(a==='category'){filter=s.categories[+v];go('tasks');return}else if(a==='filter')filter=['Все',...s.categories][+v];else if(a==='newcat'){simpleForm('cat','Новая сфера жизни','Название');return}else if(a==='idea'&&x)x.type=x.type==='Идея'?'Мысль':'Идея';else if(a==='convert'&&x){s.tasks.push({id:id(),t:x.t,c:'Личные проекты',date:day(),min:15,priority:true,done:false});s.thoughts=s.thoughts.filter(t=>t.id!==v);toast('Добавлено в задачи на сегодня.')}else if(a==='delthought')s.thoughts=s.thoughts.filter(x=>x.id!==v);else if(a==='voice'){voice();return}else if(a==='delvoice')s.voice=s.voice.filter(x=>x.id!==v);else if(a==='view')calendarView=v;else if(a==='newevent'){sheet(`<div class="row between"><h2 style="margin:0">Новое событие</h2>${btn('×','close','outline')}</div><form id="eventform"><label>Название</label><input name="t" required><label>Дата</label><input type="date" name="date" value="${selectedDay}" required><label>Время начала</label><input type="time" name="time" value="15:00" required><label>Продолжительность, мин</label><input type="number" name="min" min="1" value="30"><button class="primary wide sp">Добавить</button></form>`);return}else if(a==='delevent')s.events=s.events.filter(e=>e.id!==v);else if(a==='focus'){if(endAt){remaining=Math.max(0,Math.ceil((endAt-Date.now())/1000));endAt=0;clearInterval(tick)}else{if(!remaining)remaining=1500;endAt=Date.now()+remaining*1000;tick=setInterval(()=>{let c=$('#clock');if(c)c.textContent=clock();if(Date.now()>=endAt){clearInterval(tick);endAt=0;remaining=0;toast('Фокус-сессия закончена. Время отдохнуть!');render()}},300)}}else if(a==='resetfocus'){clearInterval(tick);remaining=1500;endAt=0}else if(a==='habit'){let h=s.habits.find(x=>x.id===v);if(h)h.done=!h.done}else if(a==='delhabit')s.habits=s.habits.filter(x=>x.id!==v);else if(a==='newhabit'){simpleForm('habitform','Новая привычка','Что хочется делать регулярно?');return}else if(a==='deldiary')s.diary=s.diary.filter(x=>x.id!==v);else if(a==='buy'&&g&&s.points>=g.price&&!s.owned.includes(v)){s.points-=g.price;s.owned.push(v);s.placed.push(v);toast('У Тиши обновка!')}else if(a==='place')s.placed=s.placed.includes(v)?s.placed.filter(x=>x!==v):[...s.placed,v];else if(a==='work'){s.work=!s.work;save();render();settings();return}else if(a==='ack'||a==='snooze'){close();toast(a==='ack'?'Решение принято.':'Перенос на 10 минут — демонстрация.');return}else if(a==='export'){let u=URL.createObjectURL(new Blob([JSON.stringify(s,null,2)],{type:'application/json'})),l=document.createElement('a');l.href=u;l.download='tishe-backup.json';l.click();setTimeout(()=>URL.revokeObjectURL(u),1000);return}else if(a==='reset'){if(!confirm('Удалить все записи и вернуть демонстрационные данные?'))return;s=initial();close()}save();render()});
document.addEventListener('submit',e=>{e.preventDefault();let f=e.target,d=new FormData(f),t=String(d.get('t')||'').trim();if(!t)return;if(f.getAttribute('id')==='taskform'){let old=s.tasks.find(x=>x.id===d.get('id')),obj={t,c:String(d.get('c')),date:String(d.get('date')||''),min:Math.max(1,Number(d.get('min'))||15),priority:d.has('priority'),remind:String(d.get('remind'))};if(old)Object.assign(old,obj);else{let done=d.get('complete')==='1';s.tasks.push({id:id(),...obj,done,rewarded:done});if(done)s.points+=2}close();toast('Дело сохранено.')}else if(f.getAttribute('id')==='thought'){s.thoughts.unshift({id:id(),t,type:'Мысль'});s.points+=2;toast('Записали. Можно больше не держать в голове.')}else if(f.getAttribute('id')==='cat'){if(!s.categories.includes(t))s.categories.push(t);close()}else if(f.getAttribute('id')==='eventform'){s.events.push({id:id(),t,date:String(d.get('date')),time:String(d.get('time')),min:Math.max(1,Number(d.get('min'))||30)});selectedDay=String(d.get('date'));close()}else if(f.getAttribute('id')==='habitform'){s.habits.push({id:id(),t,done:false});close()}else if(f.getAttribute('id')==='diary'){s.diary.unshift({id:id(),t,date:day()});toast('Запись сохранена.')}save();render()});
document.addEventListener('input',e=>{let el=e.target;if(el.dataset.time){s.timing[el.dataset.time]=el.type==='time'?el.value:Math.max(0,Math.min(600,Number(el.value)||0));$('#timeline').innerHTML=timeline();save()}if(el.dataset.budget){s.budget[el.dataset.budget]=Math.max(0,Number(el.value)||0);$('#balance').textContent=rub(balance());$('#weekly').textContent=rub(Math.max(0,balance())*12/52)+' в среднем за неделю';$('#advice').textContent=advice();save()}if(el.id==='purchase'||el.dataset.budget){let p=$('#purchase'),r=$('#purchase-result');if(p&&r){let left=balance()-Math.max(0,Number(p.value)||0);r.textContent=p.value?(left>=0?'После покупки останется '+rub(left)+'.':'Покупка превысит свободный остаток на '+rub(-left)+'.'):'Введи сумму, чтобы проверить влияние на остаток.'}}});document.addEventListener('change',e=>{if(e.target.id==='caldate'&&e.target.value){selectedDay=e.target.value;render()}});render();})();
</script><script>if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></body></html>
